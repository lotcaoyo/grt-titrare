# GRT Titrare — настройки
# Файл можно править обычным Блокнотом. Приложение перечитывает его при
# каждой обработке, перезапуск не нужен.

recognition:
  language: ru          # язык исходной речи в фильмах
  model: auto           # auto — по объёму памяти видеокарты; или large-v3 / medium
  beam_size: 1          # 1 — быстро и достаточно точно; 5 — точнее, но втрое дольше
  word_timestamps: true # false ускоряет примерно вдвое, границы фраз чуть грубее
  vad: true             # отсекать тишину: без этого Whisper выдумывает текст
  batch_size: auto      # auto — по видеокарте

subtitles:
  max_chars_per_line: 42
  max_lines: 2
  max_cps: 17           # символов в секунду, скорость чтения
  min_duration: 1.0     # секунды на экране, минимум
  max_duration: 7.0     # секунды на экране, максимум
  min_gap: 0.08         # зазор между титрами
  offset: 0.0           # общий сдвиг всех титров, секунды

sentences:
  pause_split: 0.7      # пауза, по которой резать фразу
  min_chars: 30         # короче этого — не фраза, а обрывок: приклеивается к соседней
  max_chars: 250        # предел длины одной фразы

translation:
  chunk_size: 150       # фраз в одном файле на перевод
  # Подсказка переводчику о характере материала. Пусто — нейтрально.
  # Примеры: "новостной репортаж", "документальный фильм о природе"
  genre: ""

termbase:
  # Общая термбаза на всю редакцию. Одна правка работает у всех монтажёров.
  # Пример: "\\\\grt-server\\titrare\\termbase.yaml"
  shared_path: ""

update:
  repo: "lotcaoyo/grt-titrare"
